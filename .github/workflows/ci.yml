# CI gate: the same three commands every change must pass locally
# (`mypy src/` -> `ruff check src/` -> `pytest tests/`), plus the Supabase
# security lint that LIC-T0 requires.
#
# Why the advisors step exists (design §1.3): lints 0007/0008/0013 catch
# "RLS enabled, no policy", "policy exists, RLS disabled" and "RLS disabled in
# public". Every one of those is a silent cross-tenant read, and the survey run
# for LIC-T0 found the first of them true on all 22 public tables. A human
# remembering to check is not a control; this is.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install mypy ruff pytest
      - run: mypy src/
      - run: ruff check src/
      - run: PYTHONPATH=. pytest tests/

  db-advisors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Skipped rather than failed when the repo has no Supabase credentials, so
      # a fork's CI stays green. A permanently-red job is a job people learn to
      # ignore, which is worse than one that says out loud it did not run.
      - name: supabase db advisors
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN/SUPABASE_PROJECT_ID not set — security lint SKIPPED"
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          # `db advisors` exits non-zero when it reports errors; that failure is
          # the point of the job.
          supabase db advisors --type security
